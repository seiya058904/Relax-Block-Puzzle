name: Android APK install and launch

on:
  pull_request:
    paths:
      - 'we xin xiao cheng xu-android-apk/app/**'
      - 'we xin xiao cheng xu-android-apk/gradle/**'
      - 'we xin xiao cheng xu-android-apk/gradlew'
      - 'we xin xiao cheng xu-android-apk/build.gradle.kts'
      - 'we xin xiao cheng xu-android-apk/settings.gradle.kts'
      - 'we xin xiao cheng xu-android-apk/gradle.properties'
      - 'scripts/android-emulator-smoke.*'
      - '.github/workflows/android-emulator-smoke.yml'

permissions:
  contents: read

jobs:
  android-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable KVM on the hosted runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build, install, launch, and verify WebView storage
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-snapshot -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          emulator-boot-timeout: 600
          script: bash scripts/android-emulator-smoke.sh
      - name: Preserve emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relax-android-emulator-smoke
          path: ${{ runner.temp }}/relax-android-smoke
          if-no-files-found: ignore
